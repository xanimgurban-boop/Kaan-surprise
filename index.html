<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaan için</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .kutu {
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      margin: 10px;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #mesaj {
      margin-top: 25px;
      font-size: 21px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="kutu">

    <h1>KAAN, BİR DAKİKA 😭</h1>

    <p>Senin için küçük bir şey hazırladım.</p>

    <p>Hazır mısın?</p>

    <button onclick="basla()">Evet</button>
    <button onclick="hazirDegilim()">Hayır</button>

    <div id="mesaj"></div>

  </div>

  <script>

    function basla() {
      document.getElementById("mesaj").innerHTML =
        "Güzel. İlk aşamayı geçtin. 🎮<br><br>" +
        "<button onclick='devamEt()'>Devam et</button>";
    }

    function hazirDegilim() {
      document.getElementById("mesaj").innerHTML =
        "Tamam, bekliyorum. 😐<br><br>" +
        "<button onclick='basla()'>Şimdi hazırım</button>";
    }

    function devamEt() {
      document.getElementById("mesaj").innerHTML =
        "Tebrikler. Oyunun en zor kısmını geçtin. 😭<br><br>" +
        "Ama asıl olay şimdi başlıyor... 👀";
    }

  </script>

</body>
</html>
